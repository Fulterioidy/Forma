const FN={sin:Math.sin,cos:Math.cos,tan:Math.tan,cot:x=>1/Math.tan(x),asin:Math.asin,acos:Math.acos,atan:Math.atan,sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,ln:Math.log,log:Math.log,lg:Math.log10,log10:Math.log10,log2:Math.log2,exp:Math.exp,floor:Math.floor,ceil:Math.ceil,round:Math.round,sign:Math.sign};
const ALIAS={tg:'tan',ctg:'cot',arcsin:'asin',arccos:'acos',arctg:'atan',arctan:'atan'};
const KNOWN=new Set([...Object.keys(FN),...Object.keys(ALIAS),'x','pi','e']);
function splitName(n){if(KNOWN.has(n))return[n];for(let k=n.length-1;k>=1;k--){const a=n.slice(0,k);if(KNOWN.has(a)){const r=splitName(n.slice(k));if(r)return[a,...r]}}return null}
function tokenize(s){
 s=s.replace(/^\s*[a-zA-Z]\w*\s*\(\s*x\s*\)\s*=\s*/,'').replace(/^\s*y\s*=\s*/i,'');
 s=s.replace(/[−–—]/g,'-').replace(/[×·⋅]/g,'*').replace(/÷/g,'/').replace(/\*\*/g,'^').replace(/²/g,'^2').replace(/³/g,'^3').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/(\d),(\d)/g,'$1.$2');
 const T=[],re=/\s*(?:(\d+\.?\d*|\.\d+)|([A-Za-z_]+)|([^\s]))/y;let m;
 while(re.lastIndex<s.length&&(m=re.exec(s))){
  if(m[1]!==undefined)T.push({k:'n',v:parseFloat(m[1])});
  else if(m[2]!==undefined){const parts=splitName(m[2].toLowerCase());if(!parts)throw new Error('errUnknown');parts.forEach(p=>T.push({k:'i',v:p}))}
  else if('+-*/^()'.includes(m[3]))T.push({k:'o',v:m[3]});
  else throw new Error('errChar');
 }
 return T}
function parseExpr(src){
 if(String(src).length>400)throw new Error('errSyntax');
 const T=tokenize(String(src));if(!T.length)throw new Error('errEmpty');
 let i=0;const isOp=v=>T[i]&&T[i].k==='o'&&T[i].v===v;
 const startsPrimary=()=>{const t=T[i];return t&&(t.k==='n'||t.k==='i'||(t.k==='o'&&t.v==='('))};
 function expr(){let l=term();while(isOp('+')||isOp('-')){const op=T[i++].v;l={t:'bin',op,l,r:term()}}return l}
 function term(){let l=unary();for(;;){if(isOp('*')||isOp('/')){const op=T[i++].v;l={t:'bin',op,l,r:unary()}}else if(startsPrimary())l={t:'bin',op:'*',l,r:power()};else break}return l}
 function unary(){if(isOp('-')){i++;return{t:'neg',a:unary()}}if(isOp('+')){i++;return unary()}return power()}
 function power(){const b=primary();if(isOp('^')){i++;return{t:'bin',op:'^',l:b,r:unary()}}return b}
 function paren(){if(!isOp('('))throw new Error('errSyntax');i++;const e=expr();if(!isOp(')'))throw new Error('errParen');i++;return e}
 function primary(){const t=T[i++];if(!t)throw new Error('errSyntax');
  if(t.k==='n')return{t:'num',v:t.v};
  if(t.k==='o'&&t.v==='('){i--;return paren()}
  if(t.k==='i'){
   if(t.v==='x')return{t:'x'};
   if(t.v==='pi')return{t:'k',n:'pi',v:Math.PI};
   if(t.v==='e')return{t:'k',n:'e',v:Math.E};
   const name=ALIAS[t.v]||t.v;let ex=null;
   if(isOp('^')){i++;let neg=false;if(isOp('-')){i++;neg=true}const p=primary();ex=neg?{t:'neg',a:p}:p}
   const arg=isOp('(')?paren():unary();

 items.forEach(o=>{if(o.side)return;const d=document.createElement('div');d.className='objectrow'+(sel.has(o.id)?' selected':'')+(o.show===false?' dim':'');
  d.innerHTML=`<span class="swatch" style="background:${esc(o.color||'#7fa4ff')}"></span><span class="objname">${esc(o.name)}${o.locked?' 🔒':''}</span><span class="muted val" data-vid="${o.id}"></span><button class="eye" title="${tr(o.show===false?'showObj':'hideObj')}">${o.show===false?'○':'●'}</button>`;
  d.onclick=e=>{if(e.shiftKey||e.ctrlKey||e.metaKey){if(sel.has(o.id))sel.delete(o.id);else sel.add(o.id)}else sel=new Set([o.id]);refreshSel()};
  d.querySelector('.eye').onclick=e=>{e.stopPropagation();checkpoint();o.show=o.show===false;refreshUI()};
  box.append(d)});refreshValues()}
function onceCP(el){if(!el._cp){checkpoint();el._cp=true}}
function renderProps(){const box=$('props'),objs=[...sel].map(byId).filter(Boolean);
 if(!objs.length){box.innerHTML=`<div class="muted">${tr('empty')}</div>`;return}
 if(objs.length>1){const pts=objs.filter(o=>o.type==='point'&&o.free!==false),allLocked=pts.length&&pts.every(o=>o.locked);
  box.innerHTML=`<div>${tr('selectedN')}: <b>${objs.length}</b></div><label>${tr('color')}</label><input id="pcolor" type="color" class="wide" value="${esc(objs[0].color||'#7fa4ff')}" style="height:32px;padding:2px">${pts.length?`<button id="plock" class="wide" style="margin-top:8px">${tr(allLocked?'unlock':'lock')}</button>`:''}<button id="pdelete" class="wide" style="margin-top:8px">${tr('delete')}</button>`;
  const pc=$('pcolor');pc.oninput=()=>{onceCP(pc);objs.forEach(o=>o.color=pc.value);renderItems();redraw()};pc.onchange=()=>{pc._cp=false};
  if($('plock'))$('plock').onclick=toggleLock;$('pdelete').onclick=deleteSelected;return}
 const o=objs[0],isP=isPt(o),free=o.type==='point'&&o.free!==false;
 box.innerHTML=`<label>${tr('name')}</label><input id="pname" class="wide" value="${esc(o.name)}"><label>${tr('color')}</label><input id="pcolor" type="color" class="wide" value="${esc(o.color||'#7fa4ff')}" style="height:32px;padding:2px">`+
 (isP?'':`<label>${tr('width')}</label><input id="pwidth" type="range" min="1" max="${o.type==='stroke'?24:8}" step="1" class="wide" value="${o.width||2}" style="padding:0">`)+
 `<div id="extra"></div><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="plabel" ${labelOn(o)?'checked':''}> ${tr('show')}</label><p class="muted" id="pvalue"></p>`+
 (free?`<button id="plock" class="wide" style="margin-top:4px">${tr(o.locked?'unlock':'lock')}</button>`:'')+`<button id="pdelete" class="wide" style="margin-top:8px">${tr('delete')}</button>`;
 $('pname').onchange=e=>{checkpoint();o.name=e.target.value;renderItems();redraw()};
 const pc=$('pcolor');pc.oninput=()=>{onceCP(pc);o.color=pc.value;if(o.type==='polygon')items.forEach(q=>{if(q.polyId===o.id)q.color=pc.value});renderItems();redraw()};pc.onchange=()=>{pc._cp=false};
 if($('pwidth')){const pw_=$('pwidth');pw_.oninput=()=>{onceCP(pw_);o.width=+pw_.value;redraw()};pw_.onchange=()=>{pw_._cp=false}}
 $('plabel').onchange=e=>{checkpoint();o.label=e.target.checked;redraw()};
 $('pdelete').onclick=deleteSelected;if($('plock'))$('plock').onclick=toggleLock;
 if(o.type==='point'){$('extra').innerHTML=`<label>${tr('coords')} (x, y)</label><div class="row"><input id="px" type="number" step="any" value="${+o.x.toFixed(6)}" ${o.free===false||o.locked?'disabled':''}><input id="py" type="number" step="any" value="${+o.y.toFixed(6)}" ${o.free===false||o.locked?'disabled':''}></div>`;
  ['px','py'].forEach((id,i)=>$(id).onchange=e=>{const v=Number(e.target.value);if(!Number.isFinite(v)){e.target.value=+o[i?'y':'x'].toFixed(6);return}checkpoint();o[i?'y':'x']=v;refreshValues();redraw()})}
 else if(o.type==='segment'){$('extra').innerHTML=`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="plen" ${o.showLength?'checked':''}> ${tr('length')}</label>`;$('plen').onchange=e=>{checkpoint();o.showLength=e.target.checked;redraw()}}
 $('pvalue').setAttribute('data-vid',o.id);refreshValues()}
function renderFns(){const box=$('functions');box.innerHTML='';
 functions.forEach(f=>{const row=document.createElement('div');row.className='fnwrap';
  row.innerHTML=`<div class="fnrow"><input type="checkbox" ${f.show?'checked':''}><input type="text" value="${esc(f.expr)}" spellcheck="false"><input type="color" value="${esc(f.color)}"><button title="${tr('remove')}">×</button></div><div class="fnprev"></div>`;
  const[r1,pv]=row.children,[vis,expr,color,del]=r1.children;
  const upd=()=>{const cp=compileExpr(f.expr);expr.classList.toggle('bad',!cp.ok);pv.innerHTML=cp.ok?`<span class="mx">${mx(cp.ast)}</span>`:`<span class="err">${esc(errText(cp.err))}</span>`};upd();
  vis.onchange=()=>{checkpoint();f.show=vis.checked;redraw()};
  expr.oninput=()=>{onceCP(expr);f.expr=expr.value;upd();redraw()};expr.onchange=()=>{expr._cp=false};expr.onkeydown=e=>{if(e.key==='Enter')expr.blur()};
  color.oninput=()=>{onceCP(color);f.color=color.value;redraw()};color.onchange=()=>{color._cp=false};
  del.onclick=()=>{checkpoint();functions=functions.filter(a=>a.id!==f.id);renderFns();redraw()};
  box.append(row)})}
function updateInspector(){const cp=compileExpr($('inspectExpr').value),x=Number($('inspectX').value);$('inspectExpr').classList.toggle('bad',!cp.ok);
 if(!cp.ok){$('inspectMx').innerHTML='';$('inspectY').textContent=errText(cp.err);return}
 $('inspectMx').innerHTML=`<span class="mx">f(<i>x</i>) = ${mx(cp.ast)}</span>`;
 if(!Number.isFinite(x)){$('inspectY').textContent=tr('invalid');return}
 let y;try{y=cp.fn(x)}catch{y=NaN}
 if(!Number.isFinite(y)){$('inspectY').textContent=`f(${x}) — ${tr('undefinedV')}`;return}
 const f=toFrac(y);$('inspectY').innerHTML=`f(${x}) = ${f?(f.n<0?'−':'')+`<span class="mx">${fracHTML(f)}</span> ≈ `:''}${+y.toPrecision(8)}`}
$('inspectExpr').oninput=updateInspector;$('inspectX').oninput=updateInspector;
/* pencil bar */
const SWATCHES=['#ffb454','#ff7777','#f28baf','#c2a0ff','#7fa4ff','#71d6b3','#e7e86e','#ffffff','#000000'];
function parseHex(s){s=String(s).trim().replace(/^#/,'');if(/^[0-9a-f]{3}$/i.test(s))s=s.split('').map(ch=>ch+ch).join('');return/^[0-9a-f]{6}$/i.test(s)?'#'+s.toLowerCase():null}
function setPenColor(hex){const h=parseHex(hex);if(!h)return false;pen.color=h;$('penColor').value=h;$('penHex').value=h;$('penHex').classList.remove('bad');redraw();return true}
function setPenWidth(w){pen.width=Math.max(1,Math.min(24,+w||3));$('penWidth').value=pen.width;$('penWVal').textContent=pen.width+' px';redraw()}
$('penSw').innerHTML=SWATCHES.map(h=>`<button class="sw" data-sw="${h}" style="background:${h}" title="${h}"></button>`).join('');
$('penSw').querySelectorAll('button').forEach(b=>b.onclick=()=>setPenColor(b.dataset.sw));
$('penColor').oninput=e=>setPenColor(e.target.value);
$('penHex').oninput=e=>{if(!setPenColor(e.target.value)){e.target.classList.add('bad')}};
$('penHex').onblur=e=>{e.target.value=pen.color;e.target.classList.remove('bad')};
$('penWidth').oninput=e=>setPenWidth(e.target.value);
/* tools UI */
function buildTools(){let html='';
 GROUPS.forEach(g=>{html+=`<div class="section" data-t="g_${g}"></div><div class="toolgrid">`+TOOLS.filter(t=>t.g===g).map(t=>`<button class="tool" data-tool="${t.id}"><span class="ico">${t.ic}</span><span data-t="${t.id}"></span></button>`).join('')+'</div>'});
 $('toolgrid').innerHTML=html;$('toolbar').innerHTML=TOOLS.map(t=>`<button data-tool="${t.id}">${t.ic}</button>`).join('');
 document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool))}
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=tr(el.dataset.t));
 document.querySelectorAll('[data-tool]').forEach(b=>b.title=tr(b.dataset.tool));$('undo').title=tr('undo');$('redo').title=tr('redo');
 $('penColor').title=tr('penColor');$('penWidth').title=tr('penWidth');updateHint();renderFns();renderItems();renderProps();updateInspector()}
$('language').onchange=e=>{lang=e.target.value;applyLang()};
$('undo').onclick=undo;$('redo').onclick=redo;
$('plus').onclick=()=>{scale=Math.min(1500,scale*1.2);redraw()};$('minus').onclick=()=>{scale=Math.max(4,scale/1.2);redraw()};$('home').onclick=()=>{scale=48;cx=cy=0;redraw()};
$('addfn').onclick=()=>{checkpoint();functions.push({id:nextFn++,expr:'x',color:colors[functions.length%colors.length],show:true});renderFns();redraw()};
$('grid').onchange=e=>{gridOn=e.target.checked;redraw()};$('snap').onchange=e=>snap=e.target.checked;$('osnap').onchange=e=>{osnap=e.target.checked;redraw()};$('canvasColor').oninput=e=>{bg=e.target.value;redraw()};
function resize(){const r=wrap.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.max(1,Math.round(r.width*d));c.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);draw()}
window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(wrap);

/* ================= save / load ================= */
function projectData(){return{format:'forma',version:4,items,functions,nextId,nextFn,view:{scale,cx,cy},bg,gridOn,snap,osnap,pen}}
function saveFile(){const blob=new Blob([JSON.stringify(projectData(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='forma-project.forma';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast(tr('saved'))}
function migrateItems(list){const out=[],find=id=>list.find(p=>p&&p.id===id);
 for(const src of list){if(!src||typeof src!=='object'||src.id==null)continue;const o={...src};
  if(o.kind==='derived'||o.type==='xline'){let a=o.a,b=o.b;if(!a&&o.aId!=null){const p=find(o.aId);if(p)a={x:p.x,y:p.y}}
   if(!a||!b||![a.x,a.y,b.x,b.y].every(okn))continue;
   out.push({id:o.id,type:'xline',name:o.name||'l',color:o.color,show:o.show!==false,label:o.label,a:{x:a.x,y:a.y},b:{x:b.x,y:b.y}});continue}
  if(!ALLT.includes(o.type))continue;
  if(o.type==='point'&&!(okn(o.x)&&okn(o.y)))continue;
  if(['polygon','angle','circle3','bisector'].includes(o.type)&&!Array.isArray(o.points))continue;
  if(o.type==='glider'&&!(okn(o.t)||okn(o.ang)))continue;
  if(o.type==='stroke'){if(!Array.isArray(o.pts)||!o.pts.length||!o.pts.every(a=>Array.isArray(a)&&okn(a[0])&&okn(a[1])))continue}
  if(o.type==='point'&&o.free===undefined)o.free=true;
  out.push(o)}
 {const byid=new Map(out.map(o=>[o.id,o])),st=new Map(),bad=new Set();
  const visit=o=>{const k=st.get(o.id);if(k===2)return;if(k===1){bad.add(o.id);return}st.set(o.id,1);for(const d of deps(o)){const q=byid.get(d);if(q){visit(q);if(bad.has(d))bad.add(o.id)}}st.set(o.id,2)};
  out.forEach(visit);for(let i=out.length-1;i>=0;i--)if(bad.has(out[i].id))out.splice(i,1)}
 let ch=true;while(ch){ch=false;const ids=new Set(out.map(o=>o.id));for(let i=out.length-1;i>=0;i--)if(deps(out[i]).some(d=>!ids.has(d))){out.splice(i,1);ch=true}}
 let mx=Math.max(0,...out.map(o=>+o.id||0));
 for(const g of [...out])if(g.type==='polygon'&&!out.some(q=>q.side&&q.polyId===g.id)){const n=g.points.length;g.points.forEach((id,i)=>out.push({id:++mx,type:'segment',aId:id,bId:g.points[(i+1)%n],polyId:g.id,side:true,name:'side'+mx,color:g.color||'#7fa4ff',show:true}))}
 return out}
function loadProjectText(txt){
 let d;try{d=JSON.parse(txt)}catch{toast(tr('badFile'));return false}
 if(!d||typeof d!=='object'||Array.isArray(d)||!Array.isArray(d.items)){toast(tr('badFile'));return false}
 checkpoint();
 items=migrateItems(d.items||[]);
 functions=(Array.isArray(d.functions)?d.functions:[]).filter(f=>f&&typeof f==='object').map((f,i)=>({id:f.id!=null?f.id:i+1,expr:String(f.expr==null?'':f.expr),color:/^#[0-9a-f]{6}$/i.test(f.color)?f.color:colors[i%colors.length],show:f.show!==false}));
 nextId=Math.max(Number(d.nextId)||1,...items.map(o=>+o.id+1),1);nextFn=Math.max(Number(d.nextFn)||1,...functions.map(f=>(+f.id||0)+1),1);
 if(d.view&&okn(d.view.scale)&&okn(d.view.cx)&&okn(d.view.cy)){scale=Math.max(4,Math.min(1500,d.view.scale));cx=d.view.cx;cy=d.view.cy}
 if(typeof d.bg==='string'&&/^#[0-9a-f]{6}$/i.test(d.bg))bg=d.bg;gridOn=d.gridOn!==false;snap=!!d.snap;osnap=d.osnap!==false;$('osnap').checked=osnap;
 if(d.pen){if(d.pen.color)setPenColor(d.pen.color);if(d.pen.width)setPenWidth(d.pen.width)}
 $('grid').checked=gridOn;$('snap').checked=snap;$('canvasColor').value=bg;sel=new Set();chosen=[];drawing=null;drag=null;
 renderFns();refreshUI();toast(tr('loaded'));return true}
$('save').onclick=saveFile;$('open').onclick=()=>$('fileinput').click();
$('fileinput').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>loadProjectText(String(rd.result));rd.onerror=()=>toast(tr('badFile'));rd.readAsText(f);e.target.value=''};
